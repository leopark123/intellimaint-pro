# Manual validation only. Maintainers publish reviewed releases themselves.
name: Release preparation
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Proposed pre-1.0 version, e.g. v0.1.0'
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate proposed version
        env:
          PROPOSED_VERSION: ${{ inputs.version }}
        run: |
          [[ "$PROPOSED_VERSION" =~ ^v0\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          echo 'Version syntax accepted. No tag, release or image is published by this workflow.'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test IntelliMaint.sln -c Release
      - run: dotnet publish src/Host.Api -c Release -o artifacts/api
      - uses: actions/upload-artifact@v4
        with:
          name: api-release-candidate
          path: artifacts/api
