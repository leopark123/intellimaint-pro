name: CI
on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore IntelliMaint.sln
      - run: dotnet build IntelliMaint.sln -c Release --no-restore
      - run: dotnet test IntelliMaint.sln -c Release --no-build --logger trx
      - run: dotnet build tools/DataMigration/DataMigration.csproj -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: tests/**/TestResults/*.trx
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: intellimaint-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: intellimaint-ui/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: node tools/check-docs.mjs
        working-directory: .
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/demo/init.mjs
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d
      - run: node tools/demo/smoke.mjs
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop isolated demo
        if: always()
        run: docker compose down -v
