services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: intellimaint-timescaledb
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: intellimaint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: intellimaint
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./init-scripts/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./init-scripts/02-schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./init-scripts/03-alarm-optimization.sql:/docker-entrypoint-initdb.d/03-alarm-optimization.sql:ro
      - ./init-scripts/04-timescaledb-optimization.sql:/docker-entrypoint-initdb.d/04-timescaledb-optimization.sql:ro
      - ./init-scripts/05-schema-sync.sql:/docker-entrypoint-initdb.d/05-schema-sync.sql:ro
      - ./init-scripts/06-motor-fault-prediction.sql:/docker-entrypoint-initdb.d/06-motor-fault-prediction.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellimaint"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=128MB
      -c work_mem=16MB
      -c max_connections=100
      -c wal_buffers=8MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1

volumes:
  timescaledb_data:
    driver: local
