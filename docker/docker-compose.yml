services:
  # TimescaleDB Database
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: intellimaint-timescaledb
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: intellimaint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: intellimaint
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./init-scripts/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./init-scripts/02-schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./init-scripts/03-alarm-optimization.sql:/docker-entrypoint-initdb.d/03-alarm-optimization.sql:ro
      - ./init-scripts/04-timescaledb-optimization.sql:/docker-entrypoint-initdb.d/04-timescaledb-optimization.sql:ro
      - ./init-scripts/05-schema-sync.sql:/docker-entrypoint-initdb.d/05-schema-sync.sql:ro
      - ./init-scripts/06-motor-fault-prediction.sql:/docker-entrypoint-initdb.d/06-motor-fault-prediction.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellimaint"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=128MB
      -c work_mem=16MB
      -c max_connections=100
      -c wal_buffers=8MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
    networks:
      - intellimaint-network

  # API Service
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: intellimaint-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - DatabaseProvider=TimescaleDb
      - ConnectionStrings__TimescaleDb=Host=timescaledb;Port=5432;Database=intellimaint;Username=intellimaint;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      - ADMIN_USERNAME=${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      - Edge__ApiKey=${EDGE_API_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
    depends_on:
      timescaledb:
        condition: service_healthy
    # Healthcheck removed - API runs without external dependencies
    networks:
      - intellimaint-network

  # UI Service
  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ui
    container_name: intellimaint-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    networks:
      - intellimaint-network

networks:
  intellimaint-network:
    driver: bridge

volumes:
  timescaledb_data:
    driver: local
