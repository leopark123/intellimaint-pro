<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntelliMaint Pro v44 安全测试</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 { color: #1890ff; border-bottom: 2px solid #1890ff; padding-bottom: 10px; }
        h2 { color: #333; margin-top: 30px; }
        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin: 15px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        button {
            background: #1890ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        button:hover { background: #40a9ff; }
        button:disabled { background: #d9d9d9; cursor: not-allowed; }
        button.danger { background: #ff4d4f; }
        button.danger:hover { background: #ff7875; }
        button.success { background: #52c41a; }
        .result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .result.success { background: #f6ffed; border: 1px solid #b7eb8f; }
        .result.error { background: #fff2f0; border: 1px solid #ffccc7; }
        .result.info { background: #e6f7ff; border: 1px solid #91d5ff; }
        .pass { color: #52c41a; }
        .fail { color: #ff4d4f; }
        .info-text { color: #1890ff; }
        .stats {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        .stat {
            padding: 15px 25px;
            border-radius: 8px;
            text-align: center;
        }
        .stat.pass { background: #f6ffed; border: 1px solid #b7eb8f; }
        .stat.fail { background: #fff2f0; border: 1px solid #ffccc7; }
        .stat-num { font-size: 32px; font-weight: bold; }
        .stat-label { font-size: 14px; color: #666; }
        input {
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            margin: 5px;
            width: 200px;
        }
        .progress {
            width: 100%;
            height: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #1890ff, #52c41a);
            transition: width 0.3s;
        }
        #tokenDisplay {
            word-break: break-all;
            font-size: 11px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>🔒 IntelliMaint Pro v44 安全测试</h1>
    
    <div class="stats">
        <div class="stat pass">
            <div class="stat-num" id="passCount">0</div>
            <div class="stat-label">通过</div>
        </div>
        <div class="stat fail">
            <div class="stat-num" id="failCount">0</div>
            <div class="stat-label">失败</div>
        </div>
    </div>

    <!-- 配置 -->
    <div class="card">
        <h2>⚙️ 配置</h2>
        <div>
            <input type="text" id="baseUrl" value="http://localhost:5000" placeholder="API 地址">
            <input type="text" id="username" value="admin" placeholder="用户名">
            <input type="password" id="password" autocomplete="current-password" placeholder="密码">
        </div>
        <div style="margin-top: 10px;">
            <button onclick="runAllTests()">▶️ 运行全部测试</button>
            <button onclick="clearResults()" class="danger">🗑️ 清除结果</button>
        </div>
    </div>

    <!-- 测试 1: JWT 认证 -->
    <div class="card">
        <h2>🔑 测试 1: JWT 认证</h2>
        <button onclick="testLogin()">登录测试</button>
        <button onclick="testLoginFail()">登录失败测试</button>
        <button onclick="testTokenRefresh()">Token 刷新</button>
        <button onclick="testNoAuth()">无 Token 访问</button>
        <div id="tokenDisplay"></div>
        <div id="result1" class="result info"></div>
    </div>

    <!-- 测试 2: SignalR 授权 -->
    <div class="card">
        <h2>📡 测试 2: SignalR 授权</h2>
        <button onclick="testSignalRNoAuth()">无 Token 连接</button>
        <button onclick="testSignalRWithAuth()">有 Token 连接</button>
        <button onclick="testSignalRQueryString()">Query String Token</button>
        <div id="result2" class="result info"></div>
    </div>

    <!-- 测试 3: 请求限流 -->
    <div class="card">
        <h2>🚦 测试 3: 请求限流</h2>
        <button onclick="testRateLimit()">发送 110 次请求</button>
        <div class="progress" style="display: none;" id="rateLimitProgress">
            <div class="progress-bar" id="rateLimitBar" style="width: 0%"></div>
        </div>
        <div id="result3" class="result info"></div>
    </div>

    <!-- 测试 4: 审计日志 -->
    <div class="card">
        <h2>📋 测试 4: 审计日志</h2>
        <button onclick="testAuditLog()">查询审计日志</button>
        <div id="result4" class="result info"></div>
    </div>

    <!-- 测试 5: RBAC 权限 -->
    <div class="card">
        <h2>👥 测试 5: RBAC 权限</h2>
        <button onclick="testRbacAdmin()">Admin 权限测试</button>
        <div id="result5" class="result info"></div>
    </div>

    <script>
        let token = null;
        let refreshToken = null;
        let passCount = 0;
        let failCount = 0;

        function getConfig() {
            return {
                baseUrl: document.getElementById('baseUrl').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };
        }

        function updateStats() {
            document.getElementById('passCount').textContent = passCount;
            document.getElementById('failCount').textContent = failCount;
        }

        function log(elementId, message, type = 'info') {
            const el = document.getElementById(elementId);
            const icon = type === 'pass' ? '✅' : type === 'fail' ? '❌' : 'ℹ️';
            const className = type === 'pass' ? 'pass' : type === 'fail' ? 'fail' : 'info-text';
            el.innerHTML += `<span class="${className}">${icon} ${message}</span>\n`;
            el.scrollTop = el.scrollHeight;
            
            if (type === 'pass') passCount++;
            if (type === 'fail') failCount++;
            updateStats();
        }

        function clearLog(elementId) {
            document.getElementById(elementId).innerHTML = '';
        }

        function clearResults() {
            for (let i = 1; i <= 5; i++) {
                clearLog(`result${i}`);
            }
            document.getElementById('tokenDisplay').textContent = '';
            passCount = 0;
            failCount = 0;
            updateStats();
        }

        // 测试 1: 登录
        async function testLogin() {
            clearLog('result1');
            const config = getConfig();
            
            try {
                log('result1', '正在登录...');
                const response = await fetch(`${config.baseUrl}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: config.username, password: config.password })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    token = data.data.token;
                    refreshToken = data.data.refreshToken;
                    log('result1', `登录成功，角色: ${data.data.role}`, 'pass');
                    log('result1', `获取 Token`, 'pass');
                    log('result1', `获取 Refresh Token`, 'pass');
                    document.getElementById('tokenDisplay').textContent = `Token: ${token.substring(0, 50)}...`;
                } else {
                    log('result1', `登录失败: ${data.error || '未知错误'}`, 'fail');
                }
            } catch (e) {
                log('result1', `请求异常: ${e.message}`, 'fail');
            }
        }

        // 测试登录失败
        async function testLoginFail() {
            const config = getConfig();
            
            try {
                log('result1', '测试错误密码登录...');
                const response = await fetch(`${config.baseUrl}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: config.username, password: 'wrongpassword' })
                });
                
                if (response.status === 401) {
                    log('result1', '错误密码返回 401', 'pass');
                } else {
                    log('result1', `预期 401，实际 ${response.status}`, 'fail');
                }
            } catch (e) {
                log('result1', `请求异常: ${e.message}`, 'fail');
            }
        }

        // Token 刷新
        async function testTokenRefresh() {
            if (!refreshToken) {
                log('result1', '请先登录获取 Refresh Token', 'fail');
                return;
            }
            
            const config = getConfig();
            
            try {
                log('result1', '正在刷新 Token...');
                const response = await fetch(`${config.baseUrl}/api/auth/refresh`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refreshToken })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    const oldToken = token;
                    token = data.data.token;
                    refreshToken = data.data.refreshToken;
                    
                    if (token !== oldToken) {
                        log('result1', 'Token 刷新成功 (新 Token 不同)', 'pass');
                        document.getElementById('tokenDisplay').textContent = `Token: ${token.substring(0, 50)}...`;
                    } else {
                        log('result1', 'Token 未变化', 'fail');
                    }
                } else {
                    log('result1', `Token 刷新失败: ${data.error}`, 'fail');
                }
            } catch (e) {
                log('result1', `请求异常: ${e.message}`, 'fail');
            }
        }

        // 无 Token 访问
        async function testNoAuth() {
            const config = getConfig();
            
            try {
                log('result1', '测试无 Token 访问受保护资源...');
                const response = await fetch(`${config.baseUrl}/api/devices`);
                
                if (response.status === 401) {
                    log('result1', '无 Token 返回 401', 'pass');
                } else {
                    log('result1', `预期 401，实际 ${response.status}`, 'fail');
                }
            } catch (e) {
                log('result1', `请求异常: ${e.message}`, 'fail');
            }
        }

        // SignalR 无 Token
        async function testSignalRNoAuth() {
            clearLog('result2');
            const config = getConfig();
            
            try {
                log('result2', '测试 SignalR 无 Token 连接...');
                const response = await fetch(`${config.baseUrl}/hubs/telemetry/negotiate?negotiateVersion=1`, {
                    method: 'POST'
                });
                
                if (response.status === 401) {
                    log('result2', 'SignalR 无 Token 返回 401', 'pass');
                } else {
                    log('result2', `预期 401，实际 ${response.status}`, 'fail');
                }
            } catch (e) {
                log('result2', `连接被拒绝 (预期行为)`, 'pass');
            }
        }

        // SignalR 有 Token
        async function testSignalRWithAuth() {
            if (!token) {
                log('result2', '请先登录获取 Token', 'fail');
                return;
            }
            
            const config = getConfig();
            
            try {
                log('result2', '测试 SignalR 有 Token 连接...');
                const response = await fetch(`${config.baseUrl}/hubs/telemetry/negotiate?negotiateVersion=1`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.status === 200) {
                    log('result2', 'SignalR 有 Token 返回 200', 'pass');
                } else {
                    log('result2', `预期 200，实际 ${response.status}`, 'fail');
                }
            } catch (e) {
                log('result2', `请求异常: ${e.message}`, 'fail');
            }
        }

        // SignalR Query String
        async function testSignalRQueryString() {
            if (!token) {
                log('result2', '请先登录获取 Token', 'fail');
                return;
            }
            
            const config = getConfig();
            
            try {
                log('result2', '测试 SignalR Query String Token...');
                const response = await fetch(`${config.baseUrl}/hubs/telemetry/negotiate?negotiateVersion=1&access_token=${token}`, {
                    method: 'POST'
                });
                
                if (response.status === 200) {
                    log('result2', 'SignalR Query String Token 有效', 'pass');
                } else {
                    log('result2', `预期 200，实际 ${response.status}`, 'fail');
                }
            } catch (e) {
                log('result2', `请求异常: ${e.message}`, 'fail');
            }
        }

        // 限流测试
        async function testRateLimit() {
            if (!token) {
                log('result3', '请先登录获取 Token', 'fail');
                return;
            }
            
            clearLog('result3');
            const config = getConfig();
            
            const progressContainer = document.getElementById('rateLimitProgress');
            const progressBar = document.getElementById('rateLimitBar');
            progressContainer.style.display = 'block';
            
            log('result3', '开始发送 110 次请求...');
            
            let successCount = 0;
            let limitedCount = 0;
            const total = 110;
            
            for (let i = 1; i <= total; i++) {
                try {
                    const response = await fetch(`${config.baseUrl}/api/devices`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    if (response.status === 200) {
                        successCount++;
                    } else if (response.status === 429) {
                        limitedCount++;
                    }
                    
                    progressBar.style.width = `${(i / total) * 100}%`;
                    
                    if (i % 20 === 0) {
                        log('result3', `进度: ${i}/${total} (成功: ${successCount}, 限流: ${limitedCount})`);
                    }
                } catch (e) {
                    // 忽略单个请求错误
                }
            }
            
            log('result3', `\n最终结果: 成功=${successCount}, 被限流=${limitedCount}`);
            
            if (successCount >= 95 && successCount <= 105) {
                log('result3', `成功请求数约 100 (实际: ${successCount})`, 'pass');
            } else {
                log('result3', `成功请求数异常 (实际: ${successCount})`, 'fail');
            }
            
            if (limitedCount >= 5) {
                log('result3', `被限流请求数 >= 5 (实际: ${limitedCount})`, 'pass');
            } else {
                log('result3', `限流未生效 (被限流: ${limitedCount})`, 'fail');
            }
        }

        // 审计日志
        async function testAuditLog() {
            if (!token) {
                log('result4', '请先登录获取 Token', 'fail');
                return;
            }
            
            clearLog('result4');
            const config = getConfig();
            
            try {
                log('result4', '查询审计日志...');
                const response = await fetch(`${config.baseUrl}/api/audit?pageSize=10`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    log('result4', '审计日志查询成功', 'pass');
                    
                    const items = data.data.items || [];
                    log('result4', `共 ${items.length} 条记录`, 'pass');
                    
                    // 检查登录记录
                    const loginLogs = items.filter(x => x.action === 'Login');
                    if (loginLogs.length > 0) {
                        log('result4', '包含登录审计记录', 'pass');
                    } else {
                        log('result4', '未找到登录审计记录', 'fail');
                    }
                    
                    // 检查 IP 地址
                    const hasIp = items.some(x => x.ipAddress);
                    if (hasIp) {
                        log('result4', '审计记录包含 IP 地址', 'pass');
                    } else {
                        log('result4', '审计记录无 IP 地址', 'fail');
                    }
                    
                    // 显示最近记录
                    log('result4', '\n最近审计记录:');
                    items.slice(0, 5).forEach(item => {
                        const time = new Date(item.ts).toLocaleTimeString();
                        log('result4', `  [${time}] ${item.userName} - ${item.action} - IP: ${item.ipAddress || 'N/A'}`);
                    });
                } else {
                    log('result4', `查询失败: ${data.error}`, 'fail');
                }
            } catch (e) {
                log('result4', `请求异常: ${e.message}`, 'fail');
            }
        }

        // RBAC 测试
        async function testRbacAdmin() {
            if (!token) {
                log('result5', '请先登录获取 Token', 'fail');
                return;
            }
            
            clearLog('result5');
            const config = getConfig();
            
            try {
                log('result5', '测试 Admin 访问用户管理...');
                const usersResponse = await fetch(`${config.baseUrl}/api/users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (usersResponse.status === 200) {
                    log('result5', 'Admin 可访问用户管理', 'pass');
                } else {
                    log('result5', `用户管理访问失败: ${usersResponse.status}`, 'fail');
                }
                
                log('result5', '测试 Admin 访问系统设置...');
                const settingsResponse = await fetch(`${config.baseUrl}/api/settings`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (settingsResponse.status === 200) {
                    log('result5', 'Admin 可访问系统设置', 'pass');
                } else {
                    log('result5', `系统设置访问失败: ${settingsResponse.status}`, 'fail');
                }
            } catch (e) {
                log('result5', `请求异常: ${e.message}`, 'fail');
            }
        }

        // 运行全部测试
        async function runAllTests() {
            clearResults();
            
            await testLogin();
            await new Promise(r => setTimeout(r, 500));
            
            await testLoginFail();
            await new Promise(r => setTimeout(r, 500));
            
            await testTokenRefresh();
            await new Promise(r => setTimeout(r, 500));
            
            await testNoAuth();
            await new Promise(r => setTimeout(r, 500));
            
            await testSignalRNoAuth();
            await new Promise(r => setTimeout(r, 500));
            
            await testSignalRWithAuth();
            await new Promise(r => setTimeout(r, 500));
            
            await testSignalRQueryString();
            await new Promise(r => setTimeout(r, 500));
            
            // 限流测试比较慢，单独提示
            log('result3', '⏳ 限流测试需要约 30 秒，请等待...');
            await testRateLimit();
            
            // 等待限流窗口部分恢复
            await new Promise(r => setTimeout(r, 3000));
            
            await testAuditLog();
            await new Promise(r => setTimeout(r, 500));
            
            await testRbacAdmin();
            
            // 总结
            const total = passCount + failCount;
            const rate = total > 0 ? Math.round((passCount / total) * 100) : 0;
            
            alert(`测试完成！\n\n通过: ${passCount}\n失败: ${failCount}\n通过率: ${rate}%`);
        }
    </script>
</body>
</html>
